name: Screen translation boundary

on:
  push:
    branches: [main]
    paths:
      - 'scripts/screen-translate.sh'
      - 'scripts/screen-translate-boundary-audit.sh'
      - 'modules/raohane/RaohaneScreenTranslator.qml'
      - '.github/workflows/screen-translate-boundary.yml'
  pull_request:
    paths:
      - 'scripts/screen-translate.sh'
      - 'scripts/screen-translate-boundary-audit.sh'
      - 'modules/raohane/RaohaneScreenTranslator.qml'
      - '.github/workflows/screen-translate-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-translate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raohane
        uses: actions/checkout@v4

      - name: Validate bounded screen translation backend
        shell: bash
        run: |
          bash -n scripts/screen-translate.sh
          bash -n scripts/screen-translate-boundary-audit.sh
          bash scripts/screen-translate-boundary-audit.sh
