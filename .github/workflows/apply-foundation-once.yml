name: Apply pinned foundation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-foundation-once.yml'

permissions:
  contents: write

concurrency:
  group: raohane-foundation-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raohane main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install migration tools
        run: sudo apt-get update && sudo apt-get install -y rsync jq

      - name: Validate migration scripts
        shell: bash
        run: |
          bash -n scripts/sync-end4-foundation.sh
          bash -n scripts/install-foundation-deps.sh
          bash -n scripts/raohane
          bash -n install-raohane.sh

      - name: Import pinned end4-pC runtime
        shell: bash
        run: bash scripts/sync-end4-foundation.sh --apply

      - name: Audit imported foundation
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            shell.qml
            modules/common
            modules/ii
            services
            panelFamilies
            translations
            scripts/raohane
            modules/ii/bar
            modules/ii/settings
            modules/ii/overview
            modules/ii/notificationPopup
            modules/ii/onScreenDisplay
            modules/ii/mediaControls
            modules/ii/sidebarRight
            services/Audio.qml
            services/Network.qml
            services/BluetoothStatus.qml
            services/MprisController.qml
            services/Notifications.qml
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "[audit] missing foundation path: $path" >&2
              exit 1
            fi
            echo "[audit] ok: $path"
          done

          mapfile -t font_bins < <(
            find . -path './.git' -prune -o -type f \
              \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' \) \
              -print
          )
          if ((${#font_bins[@]})); then
            echo '[audit] font binaries detected after foundation import:' >&2
            printf '  %s\n' "${font_bins[@]}" >&2
            exit 1
          fi
          echo '[audit] ok: no vendored font binaries'

          panel_family="$(jq -r '.panelFamily // "<unset>"' defaults/config.json)"
          echo "[audit] panelFamily=$panel_family"
          if [[ "$panel_family" != 'ii' ]]; then
            echo '[audit] foundation phase requires panelFamily=ii' >&2
            exit 1
          fi

          echo '[audit] imported foundation graph is structurally complete'

      - name: Commit imported foundation
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'Pinned foundation is already synchronized.'
            exit 0
          fi

          git config user.name 'Raohane Foundation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'foundation: import pinned end4-pC runtime'
          git push origin HEAD:main
