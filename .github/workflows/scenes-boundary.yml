name: Scenes boundary

on:
  push:
    branches: [main]
    paths:
      - 'modules/raohane/services/RaohaneScenes.qml'
      - 'modules/raohane/services/RaohaneSearch.qml'
      - 'modules/raohane/services/qmldir'
      - 'modules/raohane/config/RaohanePaths.qml'
      - 'modules/raohane/RaohaneContext.qml'
      - 'modules/raohane/RaohaneRuntimeProbe.qml'
      - 'modules/raohane/RaohaneSceneSwitcher.qml'
      - 'modules/raohane/RaohaneQuickControls.qml'
      - 'modules/raohane/RaohaneSettingsScenes.qml'
      - 'modules/raohane/RaohaneSettingsPageRegistry.qml'
      - 'modules/raohane/qmldir'
      - 'scripts/scenes-boundary-audit.sh'
      - '.github/workflows/scenes-boundary.yml'
  pull_request:
    paths:
      - 'modules/raohane/services/RaohaneScenes.qml'
      - 'modules/raohane/services/RaohaneSearch.qml'
      - 'modules/raohane/services/qmldir'
      - 'modules/raohane/config/RaohanePaths.qml'
      - 'modules/raohane/RaohaneContext.qml'
      - 'modules/raohane/RaohaneRuntimeProbe.qml'
      - 'modules/raohane/RaohaneSceneSwitcher.qml'
      - 'modules/raohane/RaohaneQuickControls.qml'
      - 'modules/raohane/RaohaneSettingsScenes.qml'
      - 'modules/raohane/RaohaneSettingsPageRegistry.qml'
      - 'modules/raohane/qmldir'
      - 'scripts/scenes-boundary-audit.sh'
      - '.github/workflows/scenes-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenes-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raohane
        uses: actions/checkout@v4

      - name: Install audit dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep qt6-declarative-dev-tools

      - name: Validate audit syntax
        run: bash -n scripts/scenes-boundary-audit.sh

      - name: Parse scene QML integration
        shell: bash
        run: |
          set -euo pipefail
          QMLFORMAT=/usr/lib/qt6/bin/qmlformat
          for file in \
            modules/raohane/services/RaohaneScenes.qml \
            modules/raohane/services/RaohaneSearch.qml \
            modules/raohane/RaohaneContext.qml \
            modules/raohane/RaohaneRuntimeProbe.qml \
            modules/raohane/RaohaneSceneSwitcher.qml \
            modules/raohane/RaohaneSettingsScenes.qml \
            modules/raohane/RaohaneSettingsPageRegistry.qml; do
            "$QMLFORMAT" "$file" >/dev/null
          done

      - name: Validate contextual scene boundary
        run: bash scripts/scenes-boundary-audit.sh
