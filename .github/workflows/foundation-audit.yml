name: Foundation audit

on:
  push:
    branches: [main]
    paths:
      - 'shell.qml'
      - 'GlobalStates.qml'
      - 'defaults/**'
      - 'modules/**'
      - 'panelFamilies/**'
      - 'services/**'
      - 'translations/**'
      - 'scripts/**'
      - 'upstream/**'
      - 'install-raohane.sh'
      - '.github/workflows/foundation-audit.yml'
  pull_request:
    paths:
      - 'shell.qml'
      - 'GlobalStates.qml'
      - 'defaults/**'
      - 'modules/**'
      - 'panelFamilies/**'
      - 'services/**'
      - 'translations/**'
      - 'scripts/**'
      - 'upstream/**'
      - 'install-raohane.sh'
      - '.github/workflows/foundation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raohane
        uses: actions/checkout@v4

      - name: Install audit dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync jq

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n scripts/raohane
          bash -n scripts/sync-end4-foundation.sh
          bash -n scripts/install-foundation-deps.sh
          bash -n install-raohane.sh

      - name: Validate committed foundation graph
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            shell.qml
            GlobalStates.qml
            modules/common
            modules/ii
            modules/raohane
            modules/common/Directories.qml
            panelFamilies/IllogicalImpulseFamily.qml
            panelFamilies/RaohaneFamily.qml
            services
            translations
            scripts/raohane
            modules/ii/bar
            modules/ii/settings
            modules/ii/overview
            modules/ii/notificationPopup
            modules/ii/onScreenDisplay
            modules/ii/mediaControls
            modules/ii/sidebarRight
            services/Audio.qml
            services/Network.qml
            services/BluetoothStatus.qml
            services/MprisController.qml
            services/Notifications.qml
          )

          for path in "${required_paths[@]}"; do
            [[ -e "$path" ]] || { echo "Missing foundation path: $path" >&2; exit 1; }
          done

          grep -q 'RaohaneFamily' shell.qml || {
            echo 'shell.qml no longer routes into RaohaneFamily.' >&2
            exit 1
          }
          grep -q 'config}/raohane' modules/common/Directories.qml || {
            echo 'Raohane runtime config namespace regressed.' >&2
            exit 1
          }

          if find . -path './.git' -prune -o -type f \
            \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' \) \
            -print -quit | grep -q .; then
            echo 'Vendored font binary detected.' >&2
            exit 1
          fi

          panel_family="$(jq -r '.panelFamily // "<unset>"' defaults/config.json)"
          [[ "$panel_family" == 'ii' || "$panel_family" == 'raohane' || "$panel_family" == 'ii-upstream' ]] || {
            echo "Unsupported panelFamily: $panel_family" >&2
            exit 1
          }

      - name: Validate pinned foundation preview
        shell: bash
        run: bash scripts/sync-end4-foundation.sh

      - name: Assert preview is non-mutating
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Foundation preview modified the repository:' >&2
            git status --short >&2
            git diff -- >&2
            exit 1
          fi
