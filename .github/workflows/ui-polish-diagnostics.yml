name: UI polish diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ui-polish-diagnostics.yml'
      - 'modules/raohane/**'
      - 'scripts/ui-polish-audit.sh'

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: |
          set -euo pipefail
          rg -q 'id:[[:space:]]*selectionRail' modules/raohane/RaohaneSettingsNavigation.qml
          rg -q 'RaohaneMotion\.selectionTravel' modules/raohane/RaohaneSettingsNavigation.qml
          rg -q 'function loadCurrentPage\(animated: bool\)' modules/raohane/RaohaneSettingsContentV3.qml
          rg -q 'pageLoader\.source[[:space:]]*=' modules/raohane/RaohaneSettingsContentV3.qml
          rg -q 'id:[[:space:]]*pageExit' modules/raohane/RaohaneSettingsContentV3.qml
          rg -q 'id:[[:space:]]*pageEnter' modules/raohane/RaohaneSettingsContentV3.qml
          rg -q 'RaohaneSettingsPageHeader[[:space:]]*\{' modules/raohane/RaohaneSettingsContentV3.qml
          rg -q 'RaohaneSettingsSearch[[:space:]]*\{' modules/raohane/RaohaneSettings.qml
          rg -q 'RaohaneSettingsControlRow[[:space:]]*\{' modules/raohane/RaohaneSettingsSectionPage.qml
          rg -q 'RaohaneSwitch[[:space:]]*\{' modules/raohane/RaohaneSettingsControlRow.qml
  control-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: |
          set -euo pipefail
          f=modules/raohane/RaohaneControlCenter.qml
          rg -q 'readonly property int panelHeight:' "$f"
          rg -q 'property bool heldVisible:[[:space:]]*false' "$f"
          rg -q 'quickControls\.pickerMode[[:space:]]*=[[:space:]]*""' "$f"
          rg -q 'event\.key[[:space:]]*!==[[:space:]]*Qt\.Key_Escape' "$f"
          rg -q 'RaohaneQuickControls[[:space:]]*\{' "$f"
          rg -q 'tileColumns:[[:space:]]*3' "$f"
          rg -q 'RaohaneNotificationCenter[[:space:]]*\{' "$f"
          rg -q 'StatusCell[[:space:]]*\{' "$f"
          for action in Screenshot Translator OSK Wallpaper Power; do rg -q "label:[[:space:]]*qsTr\\(\\\"${action}\\\"\\)" "$f"; done
  quick-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: |
          set -euo pipefail
          q=modules/raohane/RaohaneQuickControls.qml
          t=modules/raohane/RaohaneQuickControlTile.qml
          rg -q 'property bool iconEnabled:[[:space:]]*false' "$q"
          rg -q 'title:[[:space:]]*qsTr\("Volume"\)' "$q"
          rg -q 'contextText:[[:space:]]*RaohaneAudio\.sinkName' "$q"
          rg -q 'contextText:[[:space:]]*RaohaneAudio\.sourceName' "$q"
          rg -q 'readonly property bool tileBusy:' "$t"
          for x in 'RaohaneNetwork\.wifiBusy' 'RaohanePerformance\.busy' 'RaohaneBluetooth\.busy' 'RaohaneEasyEffects\.busy'; do rg -q "$x" "$t"; done
          rg -q 'readonly property bool tileError:' "$t"
          for x in 'RaohaneNetwork\.wifiToggleError' 'RaohanePerformance\.lastError' 'RaohaneBluetooth\.lastError' 'RaohaneEasyEffects\.lastError'; do rg -q "$x" "$t"; done
          rg -q 'RaohanePerformance\.toggleGameMode\(\)' "$t"
          rg -q 'RaohaneNetwork\.toggleWifi\(\)' "$t"
  performance-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: |
          set -euo pipefail
          p=modules/raohane/services/RaohanePerformance.qml
          c=modules/raohane/RaohaneContext.qml
          i=modules/raohane/RaohaneContextIsland.qml
          rg -q '"hyprctl",[[:space:]]*"eval",[[:space:]]*root\.modernGameModeExpression' "$p"
          rg -q 'getoption animations\.enabled' "$p"
          rg -q 'signal gameModeApplied\(bool enabled\)' "$p"
          rg -q 'root\.gameModeActive[[:space:]]*===[[:space:]]*root\.requestedGameMode' "$p"
          rg -q 'if \(root\.recording \|\| root\.camera \|\| root\.microphone\)' "$c"
          rg -q 'id:[[:space:]]*audioEventTimer' "$c"
          rg -q 'id:[[:space:]]*networkEventTimer' "$c"
          rg -q 'onGameModeApplied\(enabled: bool\)' "$c"
          rg -q 'readonly property bool progressMode:' "$i"
          rg -q 'RaohaneContext\.eventProgress' "$i"
          rg -q 'RaohaneMedia\.progress' "$i"
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: |
          set -euo pipefail
          rg -q 'RaohaneAdaptiveIcon[[:space:]]*\{' modules/raohane/RaohaneSysTray.qml
          rg -q 'source\.indexOf\("\?"\)' modules/raohane/RaohaneAdaptiveIcon.qml
          for generic in applications-system preferences-system preferences-desktop-theme multimedia-volume-control hwloc; do rg -q "name === \"${generic}\"" modules/raohane/RaohaneIconResolver.qml; done
  shared-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: |
          set -euo pipefail
          rg -q 'RaohaneMotion\.' modules/raohane/RaohaneSidebarLeft.qml
          rg -q 'RaohaneMotion\.' modules/raohane/RaohaneWorkspaces.qml
          rg -q 'RaohaneMotion\.standard' modules/raohane/RaohaneNotificationCenter.qml
          rg -q 'id:[[:space:]]*cardTranslate' modules/raohane/RaohaneOsd.qml
          rg -q 'RaohaneMotion\.' modules/raohane/RaohaneOsd.qml
