name: Raohane audit

on:
  push:
    branches: [main]
    paths:
      - 'shell.qml'
      - 'qmldir'
      - 'defaults/**'
      - 'install/**'
      - 'modules/**'
      - 'panelFamilies/**'
      - 'translations/**'
      - 'scripts/**'
      - 'install-raohane.sh'
      - '.github/workflows/raohane-audit.yml'
  pull_request:
    paths:
      - 'shell.qml'
      - 'qmldir'
      - 'defaults/**'
      - 'install/**'
      - 'modules/**'
      - 'panelFamilies/**'
      - 'translations/**'
      - 'scripts/**'
      - 'install-raohane.sh'
      - '.github/workflows/raohane-audit.yml'
  workflow_dispatch:

concurrency:
  group: raohane-audit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-and-runtime-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raohane
        uses: actions/checkout@v4

      - name: Install audit dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep qt6-declarative-dev-tools

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n scripts/raohane
          bash -n scripts/raohane-audit.sh
          bash -n scripts/service-boundary-audit.sh
          bash -n scripts/bar-boundary-audit.sh
          bash -n scripts/core-framework-audit.sh
          bash -n scripts/core-framework-phase3-audit.sh
          bash -n scripts/phase4-visible-runtime-audit.sh
          bash -n scripts/phase4-live-check.sh
          bash -n scripts/multimonitor-boundary-audit.sh
          bash -n scripts/fullscreen-boundary-audit.sh
          bash -n scripts/primary-surface-boundary-audit.sh
          bash -n scripts/overview-pointer-boundary-audit.sh
          bash -n scripts/privacy-performance-audit.sh
          bash -n scripts/sidebar-performance-audit.sh
          bash -n scripts/bluetooth-performance-audit.sh
          bash -n scripts/keyboard-layout-boundary-audit.sh
          bash -n scripts/wallpaper-boundary-audit.sh
          bash -n scripts/notification-boundary-audit.sh
          bash -n scripts/lock-boundary-audit.sh
          bash -n scripts/settings-boundary-audit.sh
          bash -n scripts/polkit-boundary-audit.sh
          bash -n scripts/frame-boundary-audit.sh
          bash -n scripts/screen-corners-boundary-audit.sh
          bash -n scripts/osk-boundary-audit.sh
          bash -n scripts/runtime-surface-boundary-audit.sh
          bash -n scripts/standalone-runtime-audit.sh
          bash -n scripts/visual-boundary-audit.sh
          bash -n scripts/ui-polish-audit.sh
          bash -n scripts/screen-translate.sh
          bash -n scripts/region-ocr.sh
          bash -n scripts/region-search.sh
          bash -n scripts/install-deps.sh
          bash -n scripts/videos/record.sh
          bash -n install-raohane.sh
          python3 scripts/migrate-legacy-config.py --help >/dev/null

      - name: Parse Raohane QML
        shell: bash
        run: |
          set -euo pipefail
          QMLFORMAT=/usr/lib/qt6/bin/qmlformat
          [[ -x "$QMLFORMAT" ]] || { echo "qmlformat not found: $QMLFORMAT" >&2; exit 1; }
          mapfile -t native_qml < <(find modules/raohane -type f -name '*.qml' -print | sort)
          files=(
            shell.qml
            panelFamilies/RaohaneFamily.qml
            "${native_qml[@]}"
          )
          for file in "${files[@]}"; do
            echo "Parsing $file"
            "$QMLFORMAT" "$file" >/dev/null
          done

      - name: Validate Raohane-owned boundaries
        shell: bash
        run: |
          bash scripts/raohane-audit.sh
          bash scripts/service-boundary-audit.sh
          bash scripts/bar-boundary-audit.sh
          bash scripts/core-framework-audit.sh
          bash scripts/core-framework-phase3-audit.sh
          bash scripts/phase4-visible-runtime-audit.sh
          bash scripts/multimonitor-boundary-audit.sh
          bash scripts/fullscreen-boundary-audit.sh
          bash scripts/primary-surface-boundary-audit.sh
          bash scripts/overview-pointer-boundary-audit.sh
          bash scripts/privacy-performance-audit.sh
          bash scripts/sidebar-performance-audit.sh
          bash scripts/bluetooth-performance-audit.sh
          bash scripts/keyboard-layout-boundary-audit.sh
          bash scripts/wallpaper-boundary-audit.sh
          bash scripts/notification-boundary-audit.sh
          bash scripts/lock-boundary-audit.sh
          bash scripts/settings-boundary-audit.sh
          bash scripts/polkit-boundary-audit.sh
          bash scripts/frame-boundary-audit.sh
          bash scripts/screen-corners-boundary-audit.sh
          bash scripts/osk-boundary-audit.sh
          bash scripts/runtime-surface-boundary-audit.sh
          bash scripts/standalone-runtime-audit.sh
          bash scripts/visual-boundary-audit.sh
          bash scripts/ui-polish-audit.sh

      - name: Validate current integration graph
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            shell.qml
            qmldir
            defaults/native.json
            install/arch/required.txt
            install/arch/features.txt
            modules/raohane
            modules/raohane/config/qmldir
            modules/raohane/config/RaohaneConfig.qml
            modules/raohane/config/RaohanePaths.qml
            modules/raohane/helpers/qmldir
            modules/raohane/helpers/RaohaneUtils.qml
            modules/raohane/models/qmldir
            modules/raohane/models/RaohaneSelectionModel.qml
            modules/raohane/RaohaneSurface.qml
            modules/raohane/RaohaneDivider.qml
            modules/raohane/RaohaneIconButton.qml
            modules/raohane/RaohaneRuntimeProbe.qml
            modules/raohane/RaohaneState.qml
            modules/raohane/RaohaneWorkspaces.qml
            modules/raohane/RaohaneSysTray.qml
            modules/raohane/RaohaneSystemIcons.qml
            modules/raohane/RaohaneClock.qml
            modules/raohane/RaohaneWallpaperSelector.qml
            modules/raohane/RaohaneNotificationCard.qml
            modules/raohane/RaohaneNotificationCenter.qml
            modules/raohane/RaohaneNotificationPopup.qml
            modules/raohane/RaohaneLock.qml
            modules/raohane/RaohaneLockContext.qml
            modules/raohane/RaohaneLockSurface.qml
            modules/raohane/RaohanePolkit.qml
            modules/raohane/RaohaneScreenFrame.qml
            modules/raohane/RaohaneRoundCorner.qml
            modules/raohane/RaohaneScreenCorners.qml
            modules/raohane/RaohaneOnScreenKeyboard.qml
            modules/raohane/RaohaneOskContent.qml
            modules/raohane/RaohaneOskKey.qml
            modules/raohane/osk/layouts.js
            modules/raohane/RaohaneOverlay.qml
            modules/raohane/RaohaneSidebarLeft.qml
            modules/raohane/RaohaneRegionSelector.qml
            modules/raohane/RaohaneScreenTranslator.qml
            modules/raohane/RaohaneVerticalBar.qml
            modules/raohane/RaohaneDropShelfPanel.qml
            modules/raohane/RaohaneSettings.qml
            modules/raohane/RaohaneSettingsSearch.qml
            modules/raohane/RaohaneSettingsContent.qml
            modules/raohane/RaohaneSettingsAbout.qml
            modules/raohane/services/RaohaneMedia.qml
            modules/raohane/services/RaohaneBluetooth.qml
            modules/raohane/services/RaohaneAudio.qml
            modules/raohane/services/RaohaneNetwork.qml
            modules/raohane/services/RaohaneDisplay.qml
            modules/raohane/services/RaohaneNotifications.qml
            modules/raohane/services/RaohaneWallpapers.qml
            modules/raohane/services/RaohaneSession.qml
            modules/raohane/services/RaohaneSessionWarnings.qml
            modules/raohane/services/RaohaneSystemInfo.qml
            modules/raohane/services/RaohaneIdle.qml
            modules/raohane/services/RaohaneEasyEffects.qml
            modules/raohane/services/RaohaneYdotool.qml
            modules/raohane/services/RaohaneDropShelf.qml
            modules/raohane/services/RaohaneAutostart.qml
            panelFamilies/RaohaneFamily.qml
            translations
            scripts/raohane
            scripts/phase4-visible-runtime-audit.sh
            scripts/phase4-live-check.sh
            scripts/multimonitor-boundary-audit.sh
            scripts/fullscreen-boundary-audit.sh
            scripts/primary-surface-boundary-audit.sh
            scripts/overview-pointer-boundary-audit.sh
            scripts/privacy-performance-audit.sh
            scripts/sidebar-performance-audit.sh
            scripts/bluetooth-performance-audit.sh
            scripts/keyboard-layout-boundary-audit.sh
            scripts/screen-translate.sh
            scripts/region-ocr.sh
            scripts/region-search.sh
            scripts/migrate-legacy-config.py
            scripts/install-deps.sh
            scripts/core-framework-audit.sh
            scripts/core-framework-phase3-audit.sh
            scripts/wallpaper-boundary-audit.sh
            scripts/notification-boundary-audit.sh
            scripts/lock-boundary-audit.sh
            scripts/settings-boundary-audit.sh
            scripts/polkit-boundary-audit.sh
            scripts/frame-boundary-audit.sh
            scripts/screen-corners-boundary-audit.sh
            scripts/osk-boundary-audit.sh
            scripts/runtime-surface-boundary-audit.sh
            scripts/standalone-runtime-audit.sh
            scripts/visual-boundary-audit.sh
            scripts/ui-polish-audit.sh
          )

          for path in "${required_paths[@]}"; do
            [[ -e "$path" ]] || { echo "Missing integration path: $path" >&2; exit 1; }
          done

          jq -e '.schemaVersion == 10' defaults/native.json >/dev/null || {
            echo 'defaults/native.json is not Raohane schema v10.' >&2
            exit 1
          }

          [[ ! -e modules/raohane/RaohaneLegacyBridge.qml ]] || {
            echo 'Retired RaohaneLegacyBridge returned to the integration graph.' >&2
            exit 1
          }

          [[ ! -e modules/ii ]] || {
            echo 'Retired modules/ii source tree returned to the integration graph.' >&2
            exit 1
          }

          grep -q 'RaohaneFamily' shell.qml || {
            echo 'shell.qml no longer routes into RaohaneFamily.' >&2
            exit 1
          }

          if find . -path './.git' -prune -o -type f \
            \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' \) \
            -print -quit | grep -q .; then
            echo 'Vendored font binary detected.' >&2
            exit 1
          fi

      - name: Assert checkout remains clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Audit modified the repository:' >&2
            git status --short >&2
            git diff -- >&2
            exit 1
          fi
