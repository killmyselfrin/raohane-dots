<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="32" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d17"/>
      <stop offset="0.58" stop-color="#141224"/>
      <stop offset="1" stop-color="#20172f"/>
    </linearGradient>
    <linearGradient id="gear" x1="74" y1="62" x2="184" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9c2ff"/>
      <stop offset="0.48" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#6852da"/>
    </linearGradient>
    <linearGradient id="petal" x1="101" y1="95" x2="151" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1d8ff"/>
      <stop offset="0.55" stop-color="#d6a9ff"/>
      <stop offset="1" stop-color="#a98cff"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#bg)"/>
  <rect x="15" y="15" width="226" height="226" rx="57" fill="none" stroke="#9b8dff" stroke-opacity=".24" stroke-width="2"/>
  <circle cx="128" cy="128" r="83" fill="none" stroke="#b7adff" stroke-opacity=".08" stroke-width="1.5"/>

  <g fill="url(#gear)" opacity=".96" filter="url(#glow)">
    <rect x="119" y="42" width="18" height="38" rx="9"/>
    <rect x="119" y="176" width="18" height="38" rx="9"/>
    <rect x="176" y="119" width="38" height="18" rx="9"/>
    <rect x="42" y="119" width="38" height="18" rx="9"/>
    <rect x="119" y="42" width="18" height="38" rx="9" transform="rotate(45 128 128)"/>
    <rect x="119" y="176" width="18" height="38" rx="9" transform="rotate(45 128 128)"/>
    <rect x="176" y="119" width="38" height="18" rx="9" transform="rotate(45 128 128)"/>
    <rect x="42" y="119" width="38" height="18" rx="9" transform="rotate(45 128 128)"/>
  </g>

  <circle cx="128" cy="128" r="57" fill="#111321" stroke="url(#gear)" stroke-width="12"/>
  <circle cx="128" cy="128" r="40" fill="#171425" stroke="#b8afff" stroke-opacity=".24" stroke-width="2"/>

  <g fill="url(#petal)" filter="url(#glow)">
    <ellipse cx="128" cy="107" rx="10" ry="19"/>
    <ellipse cx="128" cy="107" rx="10" ry="19" transform="rotate(72 128 128)"/>
    <ellipse cx="128" cy="107" rx="10" ry="19" transform="rotate(144 128 128)"/>
    <ellipse cx="128" cy="107" rx="10" ry="19" transform="rotate(216 128 128)"/>
    <ellipse cx="128" cy="107" rx="10" ry="19" transform="rotate(288 128 128)"/>
  </g>
  <circle cx="128" cy="128" r="8" fill="#f5e9ff"/>
  <circle cx="128" cy="128" r="3" fill="#725de6"/>
</svg>
