<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Raohane Wallpaper Studio — Material preview</title>
<desc id="desc">A conceptual dark glass wallpaper studio interface with a wallpaper hero, collection browser, transition choices and Matugen color palette.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11151e"/><stop offset=".55" stop-color="#202435"/><stop offset="1" stop-color="#302b42"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#657c9d"/><stop offset=".45" stop-color="#b58ca9"/><stop offset="1" stop-color="#e2bda0"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#303746" stop-opacity=".96"/><stop offset="1" stop-color="#222936" stop-opacity=".96"/></linearGradient>
  <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9e8ea9"/><stop offset="1" stop-color="#35475e"/></linearGradient>
  <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0a58f"/><stop offset="1" stop-color="#5e667e"/></linearGradient>
  <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7d9b94"/><stop offset="1" stop-color="#293e48"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .ui{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f0f8}.muted{fill:#aeb5c5}.small{font-size:14px}.label{font-size:12px;letter-spacing:1.5px;fill:#b6b7c8}.heading{font-size:25px;font-weight:650}.panel{fill:url(#glass);stroke:#ffffff;stroke-opacity:.09;stroke-width:1.2}.chip{fill:#41495b;stroke:#ffffff;stroke-opacity:.09}.accent{fill:#c6b8f2}
  </style>
</defs>
